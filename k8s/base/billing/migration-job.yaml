apiVersion: batch/v1
kind: Job
metadata:
  name: billing-migration
  namespace: tech-challenge-namespace
  labels:
    app.kubernetes.io/name: billing-migration
    app.kubernetes.io/component: billing-service
    app.kubernetes.io/part-of: tech-challenge-pos-fiap
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-migration
        app.kubernetes.io/component: billing-service
        app.kubernetes.io/part-of: tech-challenge-pos-fiap
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: billing-service:migrations
          imagePullPolicy: Always
          command:
            - node
            - scripts/run-migrations.mjs
          envFrom:
            - configMapRef:
                name: billing-config
            - secretRef:
                name: billing-secret
