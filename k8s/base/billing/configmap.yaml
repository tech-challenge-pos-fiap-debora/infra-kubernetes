apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: tech-challenge-namespace
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/component: billing-service
    app.kubernetes.io/part-of: tech-challenge-pos-fiap
data:
  NODE_ENV: production
  PORT: "3000"
  SERVICE_NAME: billing-service
  JWT_EXPIRES_IN: "1d"
  PGSSL: "true"
  NEW_RELIC_APP_NAME: billing-service
  NEW_RELIC_LABELS: service:billing-service;component:billing
  NEW_RELIC_ENABLED: "true"
  STOCK_SERVICE_URL: http://stock.tech-challenge-namespace.svc.cluster.local
  AWS_REGION: us-east-1
  HTTP_PATH_PREFIX: /billing
