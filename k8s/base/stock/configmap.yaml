apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-config
  namespace: tech-challenge-namespace
  labels:
    app.kubernetes.io/name: stock
    app.kubernetes.io/component: stock-service
    app.kubernetes.io/part-of: tech-challenge-pos-fiap
data:
  NODE_ENV: production
  PORT: "3000"
  SERVICE_NAME: stock-service
  JWT_EXPIRES_IN: "1d"
  NEW_RELIC_APP_NAME: stock-service
  NEW_RELIC_LABELS: service:stock-service;component:stock
  NEW_RELIC_ENABLED: "true"
  PGSSL: "true"
  AWS_REGION: us-east-1
  HTTP_PATH_PREFIX: /stock
