apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: tech-challenge-namespace
  labels:
    app.kubernetes.io/name: order
    app.kubernetes.io/component: order-service
    app.kubernetes.io/part-of: tech-challenge-pos-fiap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order
        app.kubernetes.io/component: order-service
        app.kubernetes.io/part-of: tech-challenge-pos-fiap
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z order-mongo 27017; do echo "aguardando order-mongo..."; sleep 2; done

      containers:
        - name: order
          image: order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-secret
          env:
            - name: NEW_RELIC_METADATA_KUBERNETES_CLUSTER_NAME
              value: tech-challenge-prod
            - name: NEW_RELIC_METADATA_KUBERNETES_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NEW_RELIC_METADATA_KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEW_RELIC_METADATA_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NEW_RELIC_METADATA_KUBERNETES_DEPLOYMENT_NAME
              value: order
            - name: NEW_RELIC_METADATA_KUBERNETES_CONTAINER_NAME
              value: order
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
