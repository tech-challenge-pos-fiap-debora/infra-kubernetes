apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-mongo
  namespace: tech-challenge-namespace
  labels:
    app.kubernetes.io/name: order-mongo
    app.kubernetes.io/component: order-service
    app.kubernetes.io/part-of: tech-challenge-pos-fiap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: order-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-mongo
        app.kubernetes.io/component: order-service
        app.kubernetes.io/part-of: tech-challenge-pos-fiap
    spec:
      containers:
        - name: order-mongo
          image: mongo:7
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: order
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping').ok
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping').ok
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: order-mongo-data
