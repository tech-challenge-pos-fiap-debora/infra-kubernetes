apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-mongo-data
  namespace: tech-challenge-namespace
  labels:
    app.kubernetes.io/name: order-mongo
    app.kubernetes.io/component: order-service
    app.kubernetes.io/part-of: tech-challenge-pos-fiap
spec:
  # O EKS não marca nenhuma StorageClass como padrão.
  storageClassName: gp2
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
