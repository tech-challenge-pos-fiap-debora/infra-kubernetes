apiVersion: batch/v1
kind: Job
metadata:
  name: order-seed
  namespace: tech-challenge-namespace
  labels:
    app.kubernetes.io/name: order-seed
    app.kubernetes.io/component: order-service
    app.kubernetes.io/part-of: tech-challenge-pos-fiap
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-seed
        app.kubernetes.io/component: order-service
        app.kubernetes.io/part-of: tech-challenge-pos-fiap
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z order-mongo 27017; do echo "aguardando order-mongo..."; sleep 2; done
      containers:
        - name: seed
          image: order-service:seed
          imagePullPolicy: Always
          command:
            - node
            - scripts/seed-mongo.mjs
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-secret
