name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_image_tag:
        description: Tag da imagem no ECR
        required: false
        default: latest

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  TF_DIR: terraform/environments/prod
  AWS_REGION: us-east-1
  NAMESPACE: tech-challenge-namespace
  API_IMAGE_TAG: ${{ github.event.inputs.api_image_tag || 'latest' }}

jobs:
  deploy:
    name: Terraform apply + deploy K8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # O bucket do state deriva do ID da conta, que muda a cada lab novo.
      - name: Terraform init
        run: ./scripts/tf-init.sh

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_api_image_tag: ${{ env.API_IMAGE_TAG }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_seed_admin_password: ${{ secrets.SEED_ADMIN_PASSWORD }}
          # Sem as chaves do New Relic o módulo de observabilidade não é criado.
          TF_VAR_new_relic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID || '0' }}
          TF_VAR_new_relic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
          TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_healthcheck_url: ${{ vars.HEALTHCHECK_URL }}
        run: terraform apply -auto-approve -input=false

      - name: Export Terraform outputs
        id: tf
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "api_ecr=$(terraform output -raw api_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "migrations_ecr=$(terraform output -raw migrations_ecr_repository_url)" >> "$GITHUB_OUTPUT"

      # O ECR e criado neste apply; as imagens so existem depois do Publish ECR
      # do repositorio app. Sem essa checagem o Job de migration fica 5 minutos
      # em ImagePullBackOff e o workflow falha mesmo com a infra pronta.
      - name: Verificar imagens no ECR
        id: images
        env:
          API_ECR: ${{ steps.tf.outputs.api_ecr }}
          MIGRATIONS_ECR: ${{ steps.tf.outputs.migrations_ecr }}
        run: |
          missing=0
          for uri in "$API_ECR" "$MIGRATIONS_ECR"; do
            repo="${uri##*/}"
            if aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids "imageTag=${API_IMAGE_TAG}" \
              >/dev/null 2>&1; then
              echo "Encontrada: ${repo}:${API_IMAGE_TAG}"
            else
              echo "Ausente: ${repo}:${API_IMAGE_TAG}"
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Imagens ausentes no ECR"
            echo
            echo "O Terraform aplicou, mas \`${API_IMAGE_TAG}\` ainda nao existe em"
            echo "\`tech-challenge-api\` e/ou \`tech-challenge-api-migrations\`."
            echo
            echo "Rode o workflow **Publish ECR** no repositorio \`app\` e depois:"
            echo
            echo '```bash'
            echo "gh workflow run deploy-prod.yml \\"
            echo "  --repo ${GITHUB_REPOSITORY} \\"
            echo "  -f api_image_tag=<sha>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "::error::Tag ${API_IMAGE_TAG} nao encontrada no ECR. Publique as imagens pelo Publish ECR do repositorio app."
            exit 1
          fi

          echo "Push na infra sem imagens publicadas: workloads K8s serao pulados."

      - uses: azure/setup-kubectl@v4
        if: steps.images.outputs.ready == 'true'

      # setup-kubectl instala apenas o kubectl. O subcomando `kustomize edit`
      # abaixo so existe no binario standalone.
      - name: Instalar kustomize
        if: steps.images.outputs.ready == 'true'
        run: |
          curl -sS "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Configure kubectl
        if: steps.images.outputs.ready == 'true'
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.tf.outputs.cluster_name }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Prepare Kustomize overlay
        if: steps.images.outputs.ready == 'true'
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            tech-challenge-api=${{ steps.tf.outputs.api_ecr }}:${{ env.API_IMAGE_TAG }}
          kustomize edit set image \
            tech-challenge-api-migrations=${{ steps.tf.outputs.migrations_ecr }}:${{ env.API_IMAGE_TAG }}

      - name: Deploy workloads (migrations antes da API)
        if: steps.images.outputs.ready == 'true'
        run: ./scripts/deploy-k8s.sh

      - name: Smoke test via ALB
        if: steps.images.outputs.ready == 'true'
        run: |
          ALB_HOST=""
          for i in $(seq 1 30); do
            ALB_HOST=$(kubectl get ingress api -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$ALB_HOST" ]; then break; fi
            echo "Aguardando ALB... ($i/30)"
            sleep 10
          done
          if [ -z "$ALB_HOST" ]; then
            kubectl describe ingress api -n "$NAMESPACE"
            exit 1
          fi
          echo "ALB: http://$ALB_HOST"
          curl -fsS "http://$ALB_HOST/health/live"
          curl -fsS "http://$ALB_HOST/health/ready"
          {
            echo "## API publicada"
            echo
            echo "- URL: http://$ALB_HOST"
            echo "- Health: http://$ALB_HOST/health/live"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl get all -n "$NAMESPACE" || true
          kubectl describe pods -n "$NAMESPACE" || true
          kubectl logs -l app.kubernetes.io/name=api -n "$NAMESPACE" --all-containers --tail=100 || true
