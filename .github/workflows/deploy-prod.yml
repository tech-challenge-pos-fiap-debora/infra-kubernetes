name: Deploy Prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Serviço (api|billing-service|stock-service|identity-service|order-service|all)"
        required: false
        default: all
      api_image_tag:
        description: Tag da API monolito
        required: false
        default: latest
      billing_image_tag:
        required: false
        default: latest
      billing_migrations_image_tag:
        required: false
        default: latest
      stock_image_tag:
        required: false
        default: latest
      stock_migrations_image_tag:
        required: false
        default: latest
      identity_image_tag:
        required: false
        default: latest
      identity_migrations_image_tag:
        required: false
        default: latest
      order_image_tag:
        required: false
        default: latest
      order_seed_image_tag:
        required: false
        default: latest

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  TF_DIR: terraform/environments/prod
  AWS_REGION: us-east-1
  NAMESPACE: tech-challenge-namespace
  DEPLOY_SERVICE: ${{ github.event.inputs.service || 'all' }}
  API_IMAGE_TAG: ${{ github.event.inputs.api_image_tag || 'latest' }}
  BILLING_IMAGE_TAG: ${{ github.event.inputs.billing_image_tag || 'latest' }}
  BILLING_MIGRATIONS_IMAGE_TAG: ${{ github.event.inputs.billing_migrations_image_tag || github.event.inputs.billing_image_tag || 'latest' }}
  STOCK_IMAGE_TAG: ${{ github.event.inputs.stock_image_tag || 'latest' }}
  STOCK_MIGRATIONS_IMAGE_TAG: ${{ github.event.inputs.stock_migrations_image_tag || github.event.inputs.stock_image_tag || 'latest' }}
  IDENTITY_IMAGE_TAG: ${{ github.event.inputs.identity_image_tag || 'latest' }}
  IDENTITY_MIGRATIONS_IMAGE_TAG: ${{ github.event.inputs.identity_migrations_image_tag || github.event.inputs.identity_image_tag || 'latest' }}
  ORDER_IMAGE_TAG: ${{ github.event.inputs.order_image_tag || 'latest' }}
  ORDER_SEED_IMAGE_TAG: ${{ github.event.inputs.order_seed_image_tag || github.event.inputs.order_image_tag || 'latest' }}

jobs:
  deploy:
    name: Terraform apply + deploy K8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: ./scripts/tf-init.sh

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_api_image_tag: ${{ env.API_IMAGE_TAG }}
          TF_VAR_billing_image_tag: ${{ env.BILLING_IMAGE_TAG }}
          TF_VAR_billing_migrations_image_tag: ${{ env.BILLING_MIGRATIONS_IMAGE_TAG }}
          TF_VAR_stock_image_tag: ${{ env.STOCK_IMAGE_TAG }}
          TF_VAR_stock_migrations_image_tag: ${{ env.STOCK_MIGRATIONS_IMAGE_TAG }}
          TF_VAR_identity_image_tag: ${{ env.IDENTITY_IMAGE_TAG }}
          TF_VAR_identity_migrations_image_tag: ${{ env.IDENTITY_MIGRATIONS_IMAGE_TAG }}
          TF_VAR_order_image_tag: ${{ env.ORDER_IMAGE_TAG }}
          TF_VAR_order_seed_image_tag: ${{ env.ORDER_SEED_IMAGE_TAG }}
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_billing_database_url: ${{ secrets.BILLING_DATABASE_URL }}
          TF_VAR_stock_database_url: ${{ secrets.STOCK_DATABASE_URL }}
          TF_VAR_identity_database_url: ${{ secrets.IDENTITY_DATABASE_URL }}
          TF_VAR_order_mongodb_uri: ${{ secrets.ORDER_MONGODB_URI }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_seed_admin_password: ${{ secrets.SEED_ADMIN_PASSWORD }}
          TF_VAR_new_relic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID || '0' }}
          TF_VAR_new_relic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
          TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_healthcheck_url: ${{ vars.HEALTHCHECK_URL }}
        run: terraform apply -auto-approve -input=false

      - name: Export Terraform outputs
        id: tf
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "api_ecr=$(terraform output -raw api_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "migrations_ecr=$(terraform output -raw migrations_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "billing_ecr=$(terraform output -raw billing_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "billing_migrations_ecr=$(terraform output -raw billing_migrations_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "stock_ecr=$(terraform output -raw stock_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "stock_migrations_ecr=$(terraform output -raw stock_migrations_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "identity_ecr=$(terraform output -raw identity_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "identity_migrations_ecr=$(terraform output -raw identity_migrations_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "order_ecr=$(terraform output -raw order_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "order_seed_ecr=$(terraform output -raw order_seed_ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-kubectl@v4
      # Versão fixa: o install_kustomize.sh consulta a API do GitHub sem token e
      # baixa uma página de erro quando o runner esbarra no rate limit.
      - name: Instalar kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.1
        run: |
          curl -fsSL --retry 3 \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp kustomize
          sudo mv /tmp/kustomize /usr/local/bin/
          kustomize version
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.tf.outputs.cluster_name }}" \
            --region "${{ env.AWS_REGION }}"

      # Monolito legado: só com service=api explícito (all = 4 MS).
      - name: Deploy API (monolito)
        if: env.DEPLOY_SERVICE == 'api'
        env:
          API_ECR: ${{ steps.tf.outputs.api_ecr }}
          MIGRATIONS_ECR: ${{ steps.tf.outputs.migrations_ecr }}
        run: |
          if ! aws ecr describe-images --repository-name "${API_ECR##*/}" --image-ids "imageTag=${API_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "API image ausente; pulando."
            exit 0
          fi
          cd k8s/overlays/prod
          kustomize edit set image "tech-challenge-api=${API_ECR}:${API_IMAGE_TAG}"
          kustomize edit set image "tech-challenge-api-migrations=${MIGRATIONS_ECR}:${API_IMAGE_TAG}"
          cd ../../..
          ./scripts/deploy-k8s.sh

      - name: Deploy billing-service
        if: env.DEPLOY_SERVICE == 'all' || env.DEPLOY_SERVICE == 'billing-service'
        env:
          ECR: ${{ steps.tf.outputs.billing_ecr }}
          MIGRATIONS_ECR: ${{ steps.tf.outputs.billing_migrations_ecr }}
        run: |
          if ! aws ecr describe-images --repository-name "${ECR##*/}" --image-ids "imageTag=${BILLING_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "billing image ausente; pulando."
            exit 0
          fi
          cd k8s/overlays/prod-billing
          kustomize edit set image "billing-service=${ECR}:${BILLING_IMAGE_TAG}"
          kustomize edit set image "billing-service-migrations=${MIGRATIONS_ECR}:${BILLING_MIGRATIONS_IMAGE_TAG}"
          cd ../../..
          ./scripts/deploy-microservice.sh billing billing-migration billing

      - name: Deploy stock-service
        if: env.DEPLOY_SERVICE == 'all' || env.DEPLOY_SERVICE == 'stock-service'
        env:
          ECR: ${{ steps.tf.outputs.stock_ecr }}
          MIGRATIONS_ECR: ${{ steps.tf.outputs.stock_migrations_ecr }}
        run: |
          if ! aws ecr describe-images --repository-name "${ECR##*/}" --image-ids "imageTag=${STOCK_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "stock image ausente; pulando."
            exit 0
          fi
          cd k8s/overlays/prod-stock
          kustomize edit set image "stock-service=${ECR}:${STOCK_IMAGE_TAG}"
          kustomize edit set image "stock-service-migrations=${MIGRATIONS_ECR}:${STOCK_MIGRATIONS_IMAGE_TAG}"
          cd ../../..
          ./scripts/deploy-microservice.sh stock stock-migration stock

      - name: Deploy identity-service
        if: env.DEPLOY_SERVICE == 'all' || env.DEPLOY_SERVICE == 'identity-service'
        env:
          ECR: ${{ steps.tf.outputs.identity_ecr }}
          MIGRATIONS_ECR: ${{ steps.tf.outputs.identity_migrations_ecr }}
        run: |
          if ! aws ecr describe-images --repository-name "${ECR##*/}" --image-ids "imageTag=${IDENTITY_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "identity image ausente; pulando."
            exit 0
          fi
          cd k8s/overlays/prod-identity
          kustomize edit set image "identity-service=${ECR}:${IDENTITY_IMAGE_TAG}"
          kustomize edit set image "identity-service-migrations=${MIGRATIONS_ECR}:${IDENTITY_MIGRATIONS_IMAGE_TAG}"
          cd ../../..
          ./scripts/deploy-microservice.sh identity identity-migration identity

      - name: Deploy order-service
        if: env.DEPLOY_SERVICE == 'all' || env.DEPLOY_SERVICE == 'order-service'
        env:
          ECR: ${{ steps.tf.outputs.order_ecr }}
          SEED_ECR: ${{ steps.tf.outputs.order_seed_ecr }}
        run: |
          if ! aws ecr describe-images --repository-name "${ECR##*/}" --image-ids "imageTag=${ORDER_IMAGE_TAG}" >/dev/null 2>&1; then
            echo "order image ausente; pulando."
            exit 0
          fi
          cd k8s/overlays/prod-order
          kustomize edit set image "order-service=${ECR}:${ORDER_IMAGE_TAG}"
          kustomize edit set image "order-service-seed=${SEED_ECR}:${ORDER_SEED_IMAGE_TAG}"
          cd ../../..
          ./scripts/deploy-microservice.sh order order-seed order

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl get all -n "$NAMESPACE" || true
          kubectl get ingress -n "$NAMESPACE" -o wide || true
          kubectl describe pods -n "$NAMESPACE" || true
